kind = "web"
previewPath = "/"
title = "بتموس - Battle Royale"
version = "1.0.0"
id = "artifacts/batmos-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19160

[services.development]
run = "pnpm --filter @workspace/batmos-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/batmos-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/batmos-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19160"
BASE_PATH = "/"
